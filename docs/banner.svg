<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Filam &amp; Pillar Church Directory</title>
  <desc id="desc">Staff-only directory with search, household map, calendar, and insights</desc>
  <defs>
    <linearGradient id="fp-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F3E6D8"/>
    </linearGradient>
    <linearGradient id="fp-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C2410C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C2410C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fp-map" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF3E8"/>
      <stop offset="100%" stop-color="#EDD9C4"/>
    </linearGradient>
    <filter id="fp-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#fp-paper)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5" fill="none" stroke="#E8D5C4"/>
  <g stroke="#E8D5C4" stroke-width="1" opacity="0.55">
    <path d="M80 0v420M160 0v420M1040 0v420M1120 0v420"/>
    <path d="M0 80h1200M0 340h1200"/>
  </g>
  <rect x="360" y="0" width="480" height="8" fill="url(#fp-glow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, sans-serif">
    <text x="88" y="112" font-size="42" font-weight="700" letter-spacing="-1" fill="#431407">Filam &amp; Pillar</text>
    <text x="88" y="158" font-size="28" font-weight="600" fill="#C2410C">Church Directory</text>
    <line x1="88" y1="176" x2="292" y2="176" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" from="0 220" to="220 0" dur="1.1s" fill="freeze"/>
    </line>
    <text x="88" y="214" font-size="18" fill="#7C5A46">Staff-only search, household map, calendar, and insights.</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="88" y="240" width="92" height="32" rx="16" fill="#FFFFFF" stroke="#E8D5C4"/>
    <circle cx="108" cy="256" r="5" fill="#C2410C"/>
    <text x="122" y="261" fill="#431407">Private</text>
    <rect x="190" y="240" width="86" height="32" rx="16" fill="#FFFFFF" stroke="#E8D5C4"/>
    <circle cx="210" cy="256" r="5" fill="#B45309"/>
    <text x="224" y="261" fill="#431407">OTP</text>
    <rect x="286" y="240" width="128" height="32" rx="16" fill="#FFFFFF" stroke="#E8D5C4"/>
    <circle cx="306" cy="256" r="5" fill="#0F766E"/>
    <text x="320" y="261" fill="#431407">Streamlit</text>
  </g>

  <!-- Directory cards -->
  <g transform="translate(680,78)" filter="url(#fp-soft)" font-family="ui-sans-serif, system-ui, sans-serif">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5.4s" begin="0.4s" repeatCount="indefinite"/>
      <rect width="430" height="86" rx="16" fill="#FFFFFF" stroke="#E8D5C4"/>
      <circle cx="44" cy="43" r="18" fill="#FDBA74"/>
      <text x="44" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#9A3412">AR</text>
      <text x="76" y="38" font-size="16" font-weight="700" fill="#431407">Ana Reyes</text>
      <text x="76" y="60" font-size="13" fill="#7C5A46">Household · Oak Park</text>
    </g>
    <g transform="translate(0,100)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="6s" begin="0.9s" repeatCount="indefinite"/>
        <rect width="430" height="86" rx="16" fill="#FFFFFF" stroke="#E8D5C4"/>
        <circle cx="44" cy="43" r="18" fill="#FDE68A"/>
        <text x="44" y="48" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">MC</text>
        <text x="76" y="38" font-size="16" font-weight="700" fill="#431407">Miguel Cruz</text>
        <text x="76" y="60" font-size="13" fill="#7C5A46">Birthday · Aug 29</text>
      </g>
    </g>
    <!-- Mini map -->
    <g transform="translate(248,208)">
      <rect x="-248" y="0" width="430" height="78" rx="16" fill="url(#fp-map)" stroke="#E8D5C4"/>
      <path d="M-220 48c28-22 54-10 80-18 30-9 48 8 78 2 22-4 40-16 62-8" fill="none" stroke="#D6B89A" stroke-width="3" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="2.2s" repeatCount="indefinite"/>
        <circle cx="-140" cy="30" r="7" fill="#C2410C"/>
        <circle cx="-40" cy="42" r="7" fill="#C2410C"/>
        <circle cx="50" cy="26" r="7" fill="#0F766E"/>
      </g>
      <text x="-228" y="22" font-size="12" font-weight="600" fill="#7C5A46">Household map</text>
    </g>
  </g>
</svg>
